# Builds the Vite app and fails if dist HTML analytics drifts from
# data/analytics.json (count, hand-typed gtag/beacon, GA4 id, or cookie).
# Does not deploy Pages.
name: analytics-dist

on:
  pull_request:

permissions:
  contents: read

jobs:
  analytics-dist:
    name: analytics-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test analytics registry and dist check
        run: node --test scripts/analytics.test.mjs

      - name: Build
        run: npm run build

      - name: Check analytics dist against registry
        run: node scripts/check-analytics-dist.mjs
