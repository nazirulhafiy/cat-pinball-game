<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111329" />
    <meta name="description" content="Cat Balls: Paws of Chaos, a playful house-cat pinball adventure." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cat Balls: Paws of Chaos</title>
    <style>
      .site-loader{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:24px;color:#fff9eb;background:radial-gradient(circle at 50% 35%,#30295e 0,#11142c 48%,#070815 100%);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif}.site-loader-panel{width:min(420px,100%);text-align:center}.site-loader-kicker{margin:0 0 5px;color:#f5c579;font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.site-loader h1{margin:0;font:700 clamp(38px,10vw,62px)/.9 Georgia,serif;letter-spacing:-.045em;text-shadow:0 5px 24px #0009}.site-loader-track{height:12px;margin:30px 0 12px;padding:2px;overflow:hidden;border:1px solid #fff5d657;border-radius:99px;background:#080a1bba;box-shadow:0 12px 35px #0008}.site-loader-fill{display:block;width:8%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f0a64e,#ffe5a6);box-shadow:0 0 18px #f0a64eb8;animation:site-loader-progress 1.15s cubic-bezier(.2,.65,.35,1) forwards;transition:width .24s ease}.site-loader.is-complete .site-loader-fill{width:100%;animation:none}.site-loader-status{margin:0;color:#c9c4da;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}@keyframes site-loader-progress{0%{width:8%}55%{width:58%}100%{width:88%}}@media(prefers-reduced-motion:reduce){.site-loader-fill{width:88%;animation:none;transition:none}}
    </style>
  </head>
  <body>
    <div id="app">
      <section class="site-loader" role="status" aria-label="Loading Cat Balls: Paws of Chaos">
        <div class="site-loader-panel">
          <p class="site-loader-kicker">Cat Balls:</p>
          <h1>Paws of Chaos</h1>
          <div class="site-loader-track" aria-hidden="true"><span class="site-loader-fill"></span></div>
          <p class="site-loader-status">Waking the house...</p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
