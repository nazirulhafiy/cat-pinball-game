<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140c2e" />
    <meta name="description" content="Cat Balls: Paws of Chaos, a playful house-cat pinball adventure." />
    <meta property="og:title" content="Cat Balls: Paws of Chaos" />
    <meta property="og:description" content="House-cat pinball. Five cats, midnight chaos." />
    <meta property="og:image" content="https://polah.app/balls/og.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://polah.app/balls/og.jpg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Cat Balls: Paws of Chaos</title>
    <style>
      .site-loader{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:24px;color:#fff6ea;background:radial-gradient(ellipse at 50% -12%,#3a2278 0%,#140c2e 48%,#100818 100%);font-family:Fredoka,ui-rounded,system-ui,sans-serif}.site-loader-panel{width:min(420px,100%);text-align:center}.site-loader-kicker{margin:0 0 6px;color:#ff4d93;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.site-loader h1{margin:0;color:#fff6ea;font:700 clamp(42px,11vw,72px)/.9 Fredoka,ui-rounded,sans-serif;letter-spacing:-.04em;text-shadow:4px 5px 0 #ff4d93}.site-loader h1 .dot{display:inline-block;width:.26em;height:.26em;margin-left:.06em;background:#ffd84a;border:.07em solid #1a120c;border-radius:50%;vertical-align:.08em}.site-loader-track{height:14px;margin:28px 0 12px;overflow:hidden;border:3px solid #1a120c;border-radius:14px;background:#241848;box-shadow:3px 4px 0 #ff4d93}.site-loader-fill{display:block;width:8%;height:100%;background:#ffd84a;animation:site-loader-progress 1.15s cubic-bezier(.22,1,.36,1) forwards}.site-loader.is-complete .site-loader-fill{width:100%;animation:none}.site-loader-status{margin:0;color:#ddd4f2;font-family:"Bricolage Grotesque",sans-serif;font-size:13px}@keyframes site-loader-progress{0%{width:8%}55%{width:58%}100%{width:88%}}@media(prefers-reduced-motion:reduce){.site-loader-fill{width:88%;animation:none}}
    </style>
  </head>
  <body>
    <div id="app">
      <section class="site-loader" role="status" aria-label="Loading Cat Balls: Paws of Chaos">
        <div class="site-loader-panel">
          <p class="site-loader-kicker">Paws of Chaos</p>
          <h1>CAT BALLS<span class="dot" aria-hidden="true"></span></h1>
          <div class="site-loader-track" aria-hidden="true"><span class="site-loader-fill"></span></div>
          <p class="site-loader-status">Waking the house…</p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
